<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrustSight · Engineering workspace</title>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<!-- No web font. The runbook contemplates running this offline on a laptop,
     and a render-blocking stylesheet from a third party would hold first paint
     at the exact moment the session starts. The stack below resolves to the
     platform UI font, so what was verified for contrast and layout is what the
     room sees, online or not. -->
<link rel="stylesheet" href="/assets/workspace.css">
<script>
  /* Set the theme before first paint so the demo never flashes white. */
  try {
    var t = localStorage.getItem('trustsight-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<!-- Everything before the engineering workspace: sign-in, projects, project
     creation and document intake. Shown one at a time, full bleed, with the
     workspace shell hidden behind it. -->
<div id="stage" hidden></div>

<aside class="sidebar">
  <a class="brand" href="/">
    <span class="brand-icon"><img src="/assets/logo.svg" alt=""></span>TrustSight<span class="brand-dot">®</span>
  </a>

  <div class="workspace-label">CLOUDSEALS / ENGINEERING</div>

  <button class="workspace-switch" id="project-switch" title="Back to projects">
    <span class="avatar" id="project-initials">TS</span>
    <div id="project-name">TrustSight<small id="project-sub">Select a project</small></div>
    <span aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </span>
  </button>

  <div class="nav-label">WORKSPACE</div>
  <nav id="nav"></nav>

  <div class="sidebar-bottom">
    <div class="connection"><i></i> Local engine connected</div>
    <p>AI-assisted interpretation.<br>Evidence-led decisions.</p>
    <button class="quiet" id="capabilities-button">
      Explore capabilities
      <svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </button>
    <button class="profile" id="profile" title="Switch demo user">
      <span class="avatar" id="user-initials">CS</span>
      <div id="user-name">CloudSeals<small id="user-role">Engineering demonstrator</small></div>
    </button>
  </div>
</aside>

<div class="app">
  <header class="topbar">
    <div>
      <span class="muted">Workspace</span><span class="slash">/</span><span id="breadcrumb">Overview</span>
    </div>
    <button class="ask-open" id="ask-open" title="Ask TrustSight about this project">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Ask TrustSight</span>
      <kbd>/</kbd>
    </button>
    <div class="top-actions">
      <span class="sample-chip" id="data-basis">SAMPLE PROJECT</span>

      <div class="bell-wrap">
        <button class="quiet" id="alerts-open" title="Alerts for this run" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M18 16V11a6 6 0 10-12 0v5l-1.5 2.5h15zM10 21h4"/></svg>
          <span class="alert-count" id="alert-count" hidden>0</span>
        </button>
        <div class="bell-panel" id="alerts-panel" hidden role="dialog" aria-label="Alerts"></div>
      </div>

      <button class="quiet" id="walkthrough" title="Play a guided walkthrough">
        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>
        <span>Walkthrough</span>
      </button>

      <button class="quiet" id="theme-toggle" title="Toggle light or dark" aria-label="Toggle colour theme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>

      <button class="quiet" id="print-summary" title="Print the schedule">
        <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
        <span>Print</span>
      </button>

      <button class="quiet" id="present" title="Hide the shell for presenting">
        <svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>
        <span>Present</span>
      </button>

      <button class="button outline small" id="reset">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
        New run
      </button>
    </div>
  </header>

  <main id="main" aria-live="polite"></main>

  <footer>
    <span>TRUSTSIGHT · Every number has a story. Every story has evidence.</span>
    <span>ENGINEERING DEMONSTRATOR / V0.3</span>
  </footer>
</div>

<div id="toast" role="status"></div>
<div id="drawer-root"></div>
<dialog id="modal"><div id="modal-body"></div></dialog>

<script src="/assets/workspace.js"></script>
</body>
</html>
