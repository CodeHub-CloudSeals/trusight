<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 516" width="1010" height="516" role="img" aria-label="Where the AI sits in TrustSight. It interprets a drawing and proposes facts with citations, but never computes a quantity and never approves a release. Deterministic rules do the arithmetic and stop to ask an engineer for anything the drawing does not state; every step is appended to a hash-chained evidence record." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1010" height="516" fill="#08111F"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93A6C2"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6FB4FF"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8C17C"/></marker><marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8897F"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7CCBB1"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#31486B"/></marker></defs><text x="40" y="44" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">Where the AI sits</text><text x="40" y="68" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">and the two things it is never allowed to do</text><rect x="40" y="100" width="140" height="108" rx="10" fill="#142338" stroke="#31486B" stroke-width="1.2"/><text x="110.0" y="144" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Drawing set</text><text x="110.0" y="166" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">native-text PDF</text><text x="110.0" y="184" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">the client's own issue</text><rect x="242" y="100" width="220" height="108" rx="10" fill="#12294A" stroke="#6FB4FF" stroke-width="2"/><text x="352.0" y="134" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Interpretation</text><text x="352.0" y="156" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">reads the sheet and proposes</text><text x="352.0" y="172" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">what a callout means</text><text x="352.0" y="194" fill="#6FB4FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">AI runs here — nowhere else</text><rect x="524" y="100" width="220" height="108" rx="10" fill="#142338" stroke="#31486B" stroke-width="1.2"/><text x="634.0" y="134" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Calculation</text><text x="634.0" y="156" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">shape catalogue, rulebook,</text><text x="634.0" y="172" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">deterministic arithmetic</text><text x="634.0" y="194" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">no model runs here</text><rect x="806" y="100" width="160" height="108" rx="10" fill="#123026" stroke="#7CCBB1" stroke-width="1.2"/><text x="886.0" y="140" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Release gate</text><text x="886.0" y="162" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">six conditions,</text><text x="886.0" y="178" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">checked per claim</text><line x1="186" y1="154.0" x2="236" y2="154.0" stroke="#93A6C2" stroke-width="1.4" marker-end="url(#arrow)"/><text x="211.0" y="138.0" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">pages</text><line x1="468" y1="154.0" x2="518" y2="154.0" stroke="#6FB4FF" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="493.0" y="124.0" fill="#6FB4FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">proposed</text><text x="493.0" y="138.0" fill="#6FB4FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">+ citation</text><line x1="750" y1="154.0" x2="800" y2="154.0" stroke="#93A6C2" stroke-width="1.4" marker-end="url(#arrow)"/><text x="775.0" y="138.0" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">quantity</text><line x1="352.0" y1="208" x2="352.0" y2="248" stroke="#E8897F" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="242" y="248" width="220" height="76" rx="10" fill="#331F1D" stroke="#E8897F" stroke-width="1.2" stroke-dasharray="5 4"/><text x="352.0" y="278" fill="#E8897F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">never computes a quantity</text><text x="352.0" y="300" fill="#E8897F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">never approves a release</text><rect x="524" y="248" width="220" height="76" rx="10" fill="#33290F" stroke="#E8C17C" stroke-width="1.2"/><text x="634.0" y="278" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Engineer</text><text x="634.0" y="300" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">answers what the drawing</text><text x="634.0" y="316" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">never states</text><line x1="576" y1="212" x2="576" y2="244" stroke="#E8C17C" stroke-width="1.4" marker-end="url(#arrow-human)"/><text x="568" y="232.0" fill="#E8C17C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">asks</text><line x1="692" y1="244" x2="692" y2="212" stroke="#E8C17C" stroke-width="1.4" marker-end="url(#arrow-human)"/><text x="700" y="232.0" fill="#E8C17C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">answers,</text><text x="700" y="246.0" fill="#E8C17C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">with a rationale</text><line x1="493.0" y1="328" x2="493.0" y2="378" stroke="#31486B" stroke-width="1.4" marker-end="url(#arrow-line)" stroke-dasharray="4 4"/><text x="485.0" y="352" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">every step appends</text><rect x="40" y="384" width="930" height="62" rx="10" fill="#142338" stroke="#31486B" stroke-width="1.2"/><text x="64" y="410" fill="#E9F1FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Evidence chain</text><text x="64" y="431" fill="#C0D0E6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">every proposal, every answer, every calculation — one hashed record naming the record before it</text><text x="40" y="498" fill="#93A6C2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">A model that proposes is useful. A model that computes the quantity, or signs off the release, is the thing being replaced.</text></svg>