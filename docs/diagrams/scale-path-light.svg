<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 566" width="1100" height="566" role="img" aria-label="What TrustSight deploys today versus what production needs, row by row. Run state is held in the application process, which forces the hosted service to run on a single instance. Moving run state to an external store is what unlocks multiple instances; sign-in, intake and the project store change independently." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1100" height="566" fill="#F3F8FC"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#55647F"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B66C2"/></marker><marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker><marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B5453A"/></marker><marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#107C4D"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C3D3E4"/></marker></defs><text x="40" y="44" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">What deploys today, and what production needs</text><text x="40" y="68" fill="#55647F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">one change unlocks the rest — the others are additive</text><text x="320.0" y="104" fill="#55647F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TODAY · DEMONSTRATOR</text><text x="750.0" y="104" fill="#55647F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PRODUCTION · WHAT CHANGES</text><text x="40" y="158.0" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Sign-in</text><rect x="150" y="122" width="340" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="168" y="158.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">demo user picker · no password checked</text><rect x="560" y="122" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="578" y="158.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Cognito, then OIDC / SAML</text><line x1="500" y1="153.0" x2="550" y2="153.0" stroke="#C3D3E4" stroke-width="1.1" marker-end="url(#arrow-line)"/><text x="40" y="232.0" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Intake</text><rect x="150" y="196" width="340" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="168" y="232.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">web upload, hashed and revisioned</text><rect x="560" y="196" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="578" y="232.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">+ S3 prefix watcher, SFTP transfer</text><line x1="500" y1="227.0" x2="550" y2="227.0" stroke="#C3D3E4" stroke-width="1.1" marker-end="url(#arrow-line)"/><text x="40" y="306.0" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">App tier</text><rect x="150" y="270" width="340" height="62" rx="10" fill="#FDECEC" stroke="#B5453A" stroke-width="1.6"/><text x="168" y="306.0" fill="#B5453A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">App Runner · pinned to 1 instance</text><rect x="560" y="270" width="380" height="62" rx="10" fill="#E3F5EB" stroke="#107C4D" stroke-width="1.6"/><text x="578" y="306.0" fill="#107C4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">App Runner · N instances</text><line x1="500" y1="301.0" x2="550" y2="301.0" stroke="#1B66C2" stroke-width="1.6" marker-end="url(#arrow-accent)"/><text x="40" y="380.0" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Run state</text><rect x="150" y="344" width="340" height="62" rx="10" fill="#FDECEC" stroke="#B5453A" stroke-width="1.6"/><text x="168" y="380.0" fill="#B5453A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">held in the process, lost on restart</text><rect x="560" y="344" width="380" height="62" rx="10" fill="#E3F5EB" stroke="#107C4D" stroke-width="1.6"/><text x="578" y="380.0" fill="#107C4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" text-anchor="start">external store (DynamoDB or Postgres)</text><line x1="500" y1="375.0" x2="550" y2="375.0" stroke="#1B66C2" stroke-width="1.6" marker-end="url(#arrow-accent)"/><text x="40" y="454.0" fill="#17233B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Projects</text><rect x="150" y="418" width="340" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="168" y="454.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">one JSON file on the instance</text><rect x="560" y="418" width="380" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="578" y="454.0" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">the same external store</text><line x1="500" y1="449.0" x2="550" y2="449.0" stroke="#C3D3E4" stroke-width="1.1" marker-end="url(#arrow-line)"/><path d="M136 375.0 C98 375.0, 98 301.0, 136 301.0" fill="none" stroke="#B5453A" stroke-width="1.6" marker-end="url(#arrow-stop)"/><text x="90" y="342.0" fill="#B5453A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="end">forces</text><path d="M954 375.0 C992 375.0, 992 301.0, 954 301.0" fill="none" stroke="#107C4D" stroke-width="1.6" marker-end="url(#arrow-ok)"/><text x="1002" y="342.0" fill="#107C4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start">unlocks</text><rect x="40" y="486" width="1020" height="62" rx="10" fill="#FFFFFF" stroke="#C3D3E4" stroke-width="1.2"/><text x="64" y="512" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">One instance is not a capacity choice. A second instance would serve runs it holds no state for,</text><text x="64" y="532" fill="#33415C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start">so the deploy pins MaxSize to 1 — and that pin lifts the moment run state moves out of the process.</text></svg>